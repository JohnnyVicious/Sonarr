name: PR Test Gate

on:
  pull_request:
    branches:
      - develop
      - main
      - v5-custom
      - v5-develop
    paths-ignore:
      - "src/NzbDrone.Core/Localization/Core/**"
      - "src/Sonarr.Api.*/openapi.json"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FRAMEWORK: net10.0
  RAW_BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
  SONARR_MAJOR_VERSION: 5
  VERSION: 5.0.0

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.variables.outputs.branch }}
      framework: ${{ steps.variables.outputs.framework }}
      version: ${{ steps.variables.outputs.version }}
    steps:
      - name: Setup variables
        id: variables
        shell: bash
        run: |
          echo "branch=${RAW_BRANCH_NAME//\//-}" >> "$GITHUB_OUTPUT"
          echo "framework=${{ env.FRAMEWORK }}" >> "$GITHUB_OUTPUT"
          echo "version=${{ env.VERSION }}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  build_test_binaries:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Validate sync regression guards
        run: bash scripts/validate-sync-regression-guards.sh

      - name: Build backend and package tests
        uses: ./.github/actions/build
        with:
          branch: ${{ needs.prepare.outputs.branch }}
          version: ${{ needs.prepare.outputs.version }}
          framework: ${{ needs.prepare.outputs.framework }}
          runtime: linux-x64
          package_tests: true

  frontend_tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Volta
        uses: volta-cli/action@615a78f6c83e116339c53b94f3f82b4d6c0b7d18

      - name: Yarn Install
        run: yarn install --frozen-lockfile

      - name: Run frontend tests
        run: yarn test:frontend

  unit_tests:
    needs: build_test_binaries
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Run unit tests
        uses: ./.github/actions/test
        with:
          os: ubuntu-latest
          artifact: tests-linux-x64
          pattern: Sonarr.*.Test.dll
          filter: TestCategory!=ManualTest&TestCategory!=WINDOWS&TestCategory!=IntegrationTest&TestCategory!=AutomationTest
