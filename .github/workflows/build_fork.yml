name: Build Fork

on:
  push:
    branches:
      - v5-develop
    paths-ignore:
      - "src/Sonarr.Api.*/openapi.json"
      - ".github/workflows/build_v5.yml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FRAMEWORK: net10.0
  SONARR_MAJOR_VERSION: 5
  VERSION: 5.0.0

jobs:
  build:
    runs-on: [self-hosted, sonarr]
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Setup variables
        id: vars
        run: |
          BRANCH="${GITHUB_REF_NAME//\//-}"
          VERSION="${{ env.VERSION }}.${{ github.run_number }}"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Stamp version
        run: |
          VERSION="${{ steps.vars.outputs.version }}"
          BRANCH="${{ steps.vars.outputs.branch }}"
          sed -i "s/<AssemblyVersion>[0-9.*]\+<\/AssemblyVersion>/<AssemblyVersion>$VERSION<\/AssemblyVersion>/g" src/Directory.Build.props
          sed -i "s/<AssemblyConfiguration>[\$()A-Za-z-]\+<\/AssemblyConfiguration>/<AssemblyConfiguration>${BRANCH}<\/AssemblyConfiguration>/g" src/Directory.Build.props

      - name: Build backend
        run: |
          rm -rf _output _tests _artifacts
          dotnet msbuild -restore src/Sonarr.sln \
            -p:SelfContained=true \
            -p:Configuration=Release \
            -p:Platform=Posix \
            -p:RuntimeIdentifiers=linux-x64 \
            -p:EnableWindowsTargeting=true \
            -t:PublishAllRids

      - name: Build frontend
        run: |
          yarn install --frozen-lockfile
          yarn build --env production

      - name: Package
        run: |
          FRAMEWORK="${{ env.FRAMEWORK }}"
          RUNTIME="linux-x64"
          BRANCH="${{ steps.vars.outputs.branch }}"
          VERSION="${{ steps.vars.outputs.version }}"

          folder="_artifacts/$RUNTIME/$FRAMEWORK/Sonarr"
          mkdir -p "$folder"

          cp -r "_output/$FRAMEWORK/$RUNTIME/publish/"* "$folder"
          cp -r "_output/Sonarr.Update/$FRAMEWORK/$RUNTIME/publish" "$folder/Sonarr.Update"
          cp LICENSE.md "$folder"

          rm -f "$folder"/ServiceUninstall.* "$folder"/ServiceInstall.*
          rm -f "$folder"/Sonarr.Windows.*

          cp "$folder"/Sonarr.Mono.* "$folder/Sonarr.Update"
          cp "$folder"/Mono.Posix.NETStandard.* "$folder/Sonarr.Update"
          cp "$folder"/libMonoPosixHelper.* "$folder/Sonarr.Update"

          cp -r _output/UI "$folder"

          find "$folder" -name "ffprobe" -exec chmod a+x {} \;
          find "$folder" -name "Sonarr" -exec chmod a+x {} \;
          find "$folder" -name "Sonarr.Update" -exec chmod a+x {} \;

          archiveName="Sonarr.$BRANCH.$VERSION.linux-x64"
          tar -zcf "_artifacts/$archiveName.tar.gz" -C "_artifacts/$RUNTIME/$FRAMEWORK" Sonarr

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sonarr-linux-x64
          retention-days: 30
          path: _artifacts/*.tar.gz

      - name: Run unit tests
        run: |
          FRAMEWORK="${{ env.FRAMEWORK }}"
          find "_tests/$FRAMEWORK/linux-x64/publish" -name "Sonarr.*.Test.dll" -print0 | \
            xargs -0 dotnet vstest --TestCaseFilter:"TestCategory!=ManualTest&TestCategory!=WINDOWS&TestCategory!=IntegrationTest&TestCategory!=AutomationTest" || true
