name: Build Fork

on:
  push:
    branches:
      - v5-custom
    paths-ignore:
      - "src/Sonarr.Api.*/openapi.json"
      - ".github/workflows/build_v5.yml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      publish_ref:
        description: "Git ref to build and publish"
        required: false
        default: "v5-custom"
      publish_image:
        description: 'Tag as latest + version (always pushes dev)'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && (inputs.publish_ref || 'v5-custom') || github.ref_name }}
  cancel-in-progress: true

env:
  FRAMEWORK: net10.0
  SONARR_MAJOR_VERSION: 5
  VERSION: 5.0.0

jobs:
  build:
    runs-on: [self-hosted, sonarr]
    outputs:
      version: ${{ steps.vars.outputs.version }}
      branch: ${{ steps.vars.outputs.branch }}
      full_sha: ${{ steps.vars.outputs.full_sha }}
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && (inputs.publish_ref || 'v5-custom') || github.sha }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet

      - name: Setup variables
        id: vars
        env:
          IS_WORKFLOW_DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
          DEFAULT_PUBLISH_REF: v5-custom
          PUBLISH_REF_INPUT: ${{ inputs.publish_ref }}
          TRIGGER_REF_NAME: ${{ github.ref_name }}
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          if [ "$IS_WORKFLOW_DISPATCH" = "true" ]; then
            RAW_BRANCH="${PUBLISH_REF_INPUT:-$DEFAULT_PUBLISH_REF}"
          else
            RAW_BRANCH="$TRIGGER_REF_NAME"
          fi

          BRANCH="$(printf '%s' "$RAW_BRANCH" | sed -e 's#[[:space:]/]#-#g' -e 's#[^A-Za-z0-9._-]#-#g' -e 's#--*#-#g' -e 's|^-||' -e 's|-$||')"
          if [ -z "$BRANCH" ]; then
            BRANCH="build"
          fi

          FULL_SHA="$(git rev-parse HEAD)"
          VERSION="${{ env.VERSION }}.${{ github.run_number }}"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "full_sha=$FULL_SHA" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Stamp version
        run: |
          VERSION="${{ steps.vars.outputs.version }}"
          BRANCH="${{ steps.vars.outputs.branch }}"
          sed -i "s/<AssemblyVersion>[0-9.*]\+<\/AssemblyVersion>/<AssemblyVersion>$VERSION<\/AssemblyVersion>/g" src/Directory.Build.props
          sed -i "s/<AssemblyConfiguration>[\$()A-Za-z-]\+<\/AssemblyConfiguration>/<AssemblyConfiguration>${BRANCH}<\/AssemblyConfiguration>/g" src/Directory.Build.props

      - name: Build backend
        run: |
          rm -rf _output _tests _artifacts
          dotnet msbuild -restore src/Sonarr.sln \
            -p:SelfContained=true \
            -p:Configuration=Release \
            -p:Platform=Posix \
            -p:RuntimeIdentifiers=linux-musl-x64 \
            -p:EnableWindowsTargeting=true \
            -t:PublishAllRids

      - name: Build frontend
        run: |
          yarn install --frozen-lockfile
          yarn build --env production

      - name: Package
        run: |
          FRAMEWORK="${{ env.FRAMEWORK }}"
          RUNTIME="linux-musl-x64"
          BRANCH="${{ steps.vars.outputs.branch }}"
          VERSION="${{ steps.vars.outputs.version }}"

          folder="_artifacts/$RUNTIME/$FRAMEWORK/Sonarr"
          mkdir -p "$folder"

          cp -r "_output/$FRAMEWORK/$RUNTIME/publish/"* "$folder"
          cp -r "_output/Sonarr.Update/$FRAMEWORK/$RUNTIME/publish" "$folder/Sonarr.Update"
          cp LICENSE.md "$folder"

          rm -f "$folder"/ServiceUninstall.* "$folder"/ServiceInstall.*
          rm -f "$folder"/Sonarr.Windows.*

          cp "$folder"/Sonarr.Mono.* "$folder/Sonarr.Update" 2>/dev/null || true
          cp "$folder"/Mono.Posix.NETStandard.* "$folder/Sonarr.Update" 2>/dev/null || true
          cp "$folder"/libMonoPosixHelper.* "$folder/Sonarr.Update" 2>/dev/null || true

          cp -r _output/UI "$folder"

          find "$folder" -name "ffprobe" -exec chmod a+x {} \;
          find "$folder" -name "Sonarr" -exec chmod a+x {} \;
          find "$folder" -name "Sonarr.Update" -exec chmod a+x {} \;

          archiveName="Sonarr.$BRANCH.$VERSION.linux-musl-x64"
          tar -zcf "_artifacts/$archiveName.tar.gz" -C "_artifacts/$RUNTIME/$FRAMEWORK" Sonarr

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: sonarr-linux-musl-x64
          retention-days: 30
          path: _artifacts/*.tar.gz

      - name: Upload docker context
        uses: actions/upload-artifact@v4
        with:
          name: sonarr-docker-context
          retention-days: 1
          path: _artifacts/linux-musl-x64/${{ env.FRAMEWORK }}/Sonarr/

      - name: Run unit tests
        run: |
          FRAMEWORK="${{ env.FRAMEWORK }}"
          find "_tests/$FRAMEWORK/linux-musl-x64/publish" -name "Sonarr.*.Test.dll" -print0 | \
            xargs -0 dotnet vstest --TestCaseFilter:"TestCategory!=ManualTest&TestCategory!=WINDOWS&TestCategory!=IntegrationTest&TestCategory!=AutomationTest" || true

  docker:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out (for Dockerfile)
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.full_sha }}

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: sonarr-docker-context
          path: Sonarr/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        if: ${{ vars.DOCKERHUB_USERNAME != '' }}
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/sonarr-xt
            ${{ vars.DOCKERHUB_USERNAME != '' && format('{0}/sonarr-xt', vars.DOCKERHUB_USERNAME) || '' }}
          tags: |
            type=raw,value=dev,enable=${{ github.ref_name == 'v5-custom' || inputs.publish_ref == 'v5-custom' }}
            type=raw,value=${{ needs.build.outputs.version }},enable=${{ inputs.publish_image == true }}
            type=raw,value=latest,enable=${{ inputs.publish_image == true }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.revision=${{ needs.build.outputs.full_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  tag:
    if: ${{ inputs.publish_image == true }}
    needs: [build, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create version tag
        uses: actions/github-script@v7
        with:
          script: |
            const tag = `v${{ needs.build.outputs.version }}`;
            try {
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/tags/${tag}`,
                sha: '${{ needs.build.outputs.full_sha }}',
              });
            } catch (e) {
              if (e.status !== 422) throw e;
              console.log(`Tag ${tag} already exists, skipping`);
            }
